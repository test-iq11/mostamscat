name: Build Mustamsakati Native Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Discover native Flutter ZIP and extract automatically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE'])
          archives = sorted(p for p in root.rglob('*') if p.is_file()
                            and p.suffix.lower() == '.zip'
                            and '.git' not in p.relative_to(root).parts)
          print('ZIP files in repository:',
                [str(p.relative_to(root)) for p in archives], flush=True)
          candidates = []
          for archive in archives:
              try:
                  with zipfile.ZipFile(archive) as z:
                      files = {p.replace('\\', '/') for p in z.namelist()}
                      for n in files:
                          if (n == 'pubspec.yaml' or n.endswith('/pubspec.yaml')):
                              prefix = n[:-len('pubspec.yaml')]
                              if all(prefix + x in files for x in
                                     ('lib/main.dart', 'lib/perspective.dart',
                                      'lib/layouts.dart', 'lib/exporters.dart')):
                                  candidates.append((archive, prefix))
                                  print('Eligible native project:', archive, 'root:', prefix)
                                  break
              except (OSError, zipfile.BadZipFile) as exc:
                  print('Not a readable ZIP:', archive, exc)
          if not candidates:
              sys.exit('::error::Native Flutter ZIP not found in current branch. '
                       'Upload the new mustamsakati.zip file, without extraction.')
          # Select the latest modified eligible ZIP (not an obsolete WebView project).
          archive, prefix = sorted(candidates,
              key=lambda item: (item[0].stat().st_mtime,
                                item[0].name.lower()), reverse=True)[0]
          extracted = Path(os.environ['RUNNER_TEMP']) / 'native_unzipped'
          output = Path(os.environ['RUNNER_TEMP']) / 'build_project'
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip():
                  sys.exit('::error::ZIP contains a corrupt entry')
              for entry in z.infolist():
                  path = PurePosixPath(entry.filename.replace('\\', '/'))
                  if path.is_absolute() or '..' in path.parts:
                      sys.exit('::error::Unsafe ZIP entry found')
              z.extractall(extracted)
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree(extracted / prefix, output)
          print('Using native Flutter project:', archive)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROJECT_DIR=' + str(output) + '\n')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate official Flutter Android platform (no HTML/WebView)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          flutter create --platforms android --project-name mustamsakati \
            --org iq.mustamsakati --android-language kotlin --no-pub .
          # Remove Flutter template test if the generator created one.
          # Its default MyApp reference does not belong to this project.
          if [[ -f test/widget_test.dart ]] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android/app')
          manifest = base / 'src/main/AndroidManifest.xml'
          text = manifest.read_text()
          text = text.replace('android:label="mustamsakati"',
                              'android:label="مستمسكاتي"')
          manifest.write_text(text)
          for gradle in (base / 'build.gradle.kts', base / 'build.gradle'):
              if gradle.exists():
                  text = gradle.read_text()
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
                  gradle.write_text(text)
          # Use the exact pre-rendered app icon used in the Flutter header.
          import shutil
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              folder = base / 'src/main/res' / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(f'assets/icons/ic_launcher_{density}.png',
                              folder / 'ic_launcher.png')
          PY
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Use smaller Gradle distribution with retries (avoid GitHub 504)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PYGRADLE'
          from pathlib import Path
          import re
          import sys

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if not wrapper.is_file():
              sys.exit('::error::Gradle wrapper properties not found after flutter create')
          settings = wrapper.read_text(encoding='utf-8')
          match = re.search(r'^distributionUrl=.*?/gradle-(\d+(?:\.\d+){1,2})-(?:all|bin)\.zip\s*$', settings, re.M)
          if not match:
              print(settings)
              sys.exit('::error::Unknown Gradle distribution URL. Refusing to guess Gradle version.')
          version = match.group(1)
          # Keep the Gradle version selected by Flutter to avoid AGP compatibility issues.
          url = f'https\\://downloads.gradle.org/distributions/gradle-{version}-bin.zip'
          settings = re.sub(r'^distributionUrl=.*$', 'distributionUrl=' + url, settings, count=1, flags=re.M)
          for key, value in [('networkTimeout', '120000'), ('retries', '5'), ('retryBackOffMs', '2000')]:
              line = f'{key}={value}'
              if re.search(rf'^{key}=.*$', settings, re.M):
                  settings = re.sub(rf'^{key}=.*$', line, settings, count=1, flags=re.M)
              else:
                  settings = settings.rstrip() + '\n' + line + '\n'
          wrapper.write_text(settings, encoding='utf-8')
          print('Gradle version retained:', version)
          print('New Gradle distribution: https://downloads.gradle.org/distributions/gradle-' + version + '-bin.zip')
          print('Network timeout and automatic download retries enabled.')
          PYGRADLE
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Run native Flutter unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mustamsakati-native-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
