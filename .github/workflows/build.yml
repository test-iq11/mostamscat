name: Build Mustamsakati APK From ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Flutter and Android toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP without manual extraction
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'mustamsakati-flutter-v*.zip' -print -quit)"
          if [[ -z "$ARCHIVE" ]]; then
            echo 'Upload mustamsakati-flutter-v4.0.0.zip to repository root WITHOUT extracting'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mustamsakati_unpacked"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/mustamsakati_unpacked"
          APP_DIR="$(find "$RUNNER_TEMP/mustamsakati_unpacked" -name pubspec.yaml -print -quit | xargs -r dirname)"
          if [[ -z "$APP_DIR" || ! -f "$APP_DIR/lib/main.dart" || ! -f "$APP_DIR/assets/app/index.html" ]]; then
            echo 'A valid Flutter project with pubspec.yaml, lib/main.dart, HTML asset is missing'; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/build_project"
          cp -a "$APP_DIR/." "$RUNNER_TEMP/build_project/"
          echo "PROJECT_DIR=$RUNNER_TEMP/build_project" >> "$GITHUB_ENV"

      - name: Supply official Gradle wrapper jar matching Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter create --project-name mustamsakati --org iq.mustamsakati --platforms android --no-pub "$RUNNER_TEMP/android_scaffold"
          mkdir -p "$PROJECT_DIR/android/gradle/wrapper"
          cp "$RUNNER_TEMP/android_scaffold/android/gradle/wrapper/gradle-wrapper.jar" "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.jar"
          cp "$RUNNER_TEMP/android_scaffold/android/gradlew" "$PROJECT_DIR/android/gradlew"
          chmod +x "$PROJECT_DIR/android/gradlew"
          FLUTTER_ROOT="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then echo 'Android SDK missing'; exit 1; fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$SDK_ROOT" > "$PROJECT_DIR/android/local.properties"
          echo "Flutter: $(flutter --version | head -n 1)"

      - name: Resolve dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze strictly
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze

      - name: Run unit and asset tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mustamsakati-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
