name: Build Mustamsakati Flutter Native v6.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Discover native Flutter ZIP and extract automatically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['GITHUB_WORKSPACE'])
          archives = sorted(p for p in root.rglob('*') if p.is_file()
                            and p.suffix.lower() == '.zip'
                            and '.git' not in p.relative_to(root).parts)
          print('ZIP files in repository:',
                [str(p.relative_to(root)) for p in archives], flush=True)
          candidates = []
          for archive in archives:
              try:
                  with zipfile.ZipFile(archive) as z:
                      files = {p.replace('\\', '/') for p in z.namelist()}
                      for n in files:
                          if (n == 'pubspec.yaml' or n.endswith('/pubspec.yaml')):
                              prefix = n[:-len('pubspec.yaml')]
                              if all(prefix + x in files for x in
                                     ('lib/main.dart', 'lib/perspective.dart',
                                      'lib/layouts.dart', 'lib/exporters.dart',
                                      'assets/demo/sample_front.jpg',
                                      'lib/scan_filters.dart')):
                                  candidates.append((archive, prefix))
                                  print('Eligible native project:', archive, 'root:', prefix)
                                  break
              except (OSError, zipfile.BadZipFile) as exc:
                  print('Not a readable ZIP:', archive, exc)
          if not candidates:
              sys.exit('::error::Native Flutter ZIP not found in current branch. '
                       'Upload the mustamsakati Flutter v6.1 ZIP to the SAME branch, without extraction.')
          # Select the greatest numeric pubspec version, so a previous ZIP
          # cannot silently override the corrected project during CI.
          import re
          def project_rank(item):
              archive, prefix = item
              with zipfile.ZipFile(archive) as z:
                  manifest = z.read(prefix + 'pubspec.yaml').decode('utf-8')
              version_match = re.search(
                  r'^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?',
                  manifest, re.M)
              if not version_match:
                  return (0, 0, 0, 0, archive.name.lower())
              numbers = tuple(int(n or 0) for n in version_match.groups())
              return (*numbers, archive.name.lower())
          archive, prefix = max(candidates, key=project_rank)
          chosen_version = project_rank((archive, prefix))[:4]
          if chosen_version < (6, 1, 0, 1):
              sys.exit('::error::Flutter project v6.1+ was not found. Upload the new ZIP on this branch.')
          extracted = Path(os.environ['RUNNER_TEMP']) / 'native_unzipped'
          output = Path(os.environ['RUNNER_TEMP']) / 'build_project'
          if extracted.exists():
              shutil.rmtree(extracted)
          extracted.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              if z.testzip():
                  sys.exit('::error::ZIP contains a corrupt entry')
              for entry in z.infolist():
                  path = PurePosixPath(entry.filename.replace('\\', '/'))
                  if path.is_absolute() or '..' in path.parts:
                      sys.exit('::error::Unsafe ZIP entry found')
              z.extractall(extracted)
          if output.exists():
              shutil.rmtree(output)
          shutil.copytree(extracted / prefix, output)
          print('Using native Flutter project:', archive, 'version:', project_rank((archive, prefix))[:4])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROJECT_DIR=' + str(output) + '\n')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate official Flutter Android platform (no HTML/WebView)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          flutter create --platforms android --project-name mustamsakati \
            --org iq.mustamsakati --android-language kotlin --no-pub .
          # Remove Flutter template test if the generator created one.
          # Its default MyApp reference does not belong to this project.
          if [[ -f test/widget_test.dart ]] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android/app')
          manifest = base / 'src/main/AndroidManifest.xml'
          text = manifest.read_text()
          text = text.replace('android:label="mustamsakati"',
                              'android:label="مستمسكاتي"')
          manifest.write_text(text)
          for gradle in (base / 'build.gradle.kts', base / 'build.gradle'):
              if gradle.exists():
                  text = gradle.read_text()
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
                  gradle.write_text(text)
          # Use the exact pre-rendered app icon used in the Flutter header.
          import shutil
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              folder = base / 'src/main/res' / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(f'assets/icons/ic_launcher_{density}.png',
                              folder / 'ic_launcher.png')
          PY
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Make Gradle download resilient
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ['PROJECT_DIR']) / 'android/gradle/wrapper/gradle-wrapper.properties'
          text = p.read_text()
          pattern = r'gradle-(\d+(?:\.\d+){1,2})-(?:all|bin)\.zip'
          hit = re.search(pattern, text)
          if hit is None:
              raise RuntimeError('Expected Gradle distribution was not found')
          version = hit.group(1)
          url = f'https\\://downloads.gradle.org/distributions/gradle-{version}-bin.zip'
          text = re.sub(r'^distributionUrl=.*$', lambda _: 'distributionUrl=' + url,
                        text, count=1, flags=re.M)
          text = re.sub(r'^distributionSha256Sum=.*\n?', '', text, flags=re.M)
          for option, val in [('networkTimeout','120000'), ('retries','5'), ('retryBackOffMs','2000')]:
              text = re.sub(r'^' + option + r'=.*\n?', '', text, flags=re.M)
              text += f'\n{option}={val}\n'
          p.write_text(text)
          print('Gradle distribution:', version, '(bin, retry enabled)')
          PY

      - name: Install Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Run native Flutter unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mustamsakati-v6-1-native-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
