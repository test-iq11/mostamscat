name: Build Mustamsakati Android 8.0.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - mustamsakati-flutter-v8.0.0.zip
      - .github/workflows/**

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      STUDIO_ZIP: mustamsakati-flutter-v8.0.0.zip
    steps:
      - uses: actions/checkout@v5

      - name: Extract the project ZIP from the repository root
        run: |
          set -euo pipefail
          export PROJECT_DIR="$RUNNER_TEMP/mustamsakati-v8"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os
          import stat
          import sys

          archive = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['STUDIO_ZIP']
          target = Path(os.environ['PROJECT_DIR'])
          if not archive.is_file():
              sys.exit(f'::error::Upload {archive.name} to the repository root without extracting it.')
          with ZipFile(archive) as source:
              if source.testzip() is not None:
                  sys.exit('::error::Corrupt project ZIP. Download and upload it again.')
              required = {'pubspec.yaml', 'lib/main.dart', 'scripts/prepare_android.py',
                          'android_overlay/src/main/assets/mustamsakati_studio.html'}
              names = source.namelist()
              if not required.issubset(names) or len(names) != len(set(names)):
                  sys.exit('::error::ZIP does not contain the expected Flutter project files.')
              for item in source.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or stat.S_ISLNK(item.external_attr >> 16):
                      sys.exit('::error::Invalid ZIP path.')
              target.mkdir(parents=True, exist_ok=True)
              source.extractall(target)
          PY
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify bundled offline interface
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/validate_source.py

      - name: Generate and prepare Android platform
        run: |
          set -euo pipefail
          scaffold="$(mktemp -d "$RUNNER_TEMP/mustamsakati-scaffold.XXXXXX")"
          flutter create --no-pub --platforms=android --org iq.mustamsakati \
            --project-name mustamsakati --android-language java "$scaffold"
          cd "$PROJECT_DIR"
          python3 scripts/prepare_android.py "$scaffold"
          flutter pub get

      - name: Analyze and test Flutter code
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      - name: Build release APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mustamsakati-v8.0.0-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
