name: Build Mustamsakati Flutter Native 8.2.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - mustamsakati-flutter-v8.2.0-native.zip
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STUDIO_ZIP: mustamsakati-flutter-v8.2.0-native.zip
    steps:
      - uses: actions/checkout@v5

      - name: Extract the native Flutter ZIP
        shell: bash
        run: |
          set -euo pipefail
          export PROJECT_DIR="$RUNNER_TEMP/mustamsakati-native-v8.2.0"
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os
          import stat
          import sys

          archive = Path(os.environ['GITHUB_WORKSPACE']) / os.environ['STUDIO_ZIP']
          target = Path(os.environ['PROJECT_DIR'])
          if not archive.is_file():
              sys.exit(f'::error::Upload {archive.name} to the repository root without extracting it.')
          with ZipFile(archive) as source:
              entries = source.namelist()
              required = {'pubspec.yaml', 'lib/main.dart', 'lib/vault.dart', 'lib/redaction.dart',
                          'scripts/validate_source.py', 'lib/camera_capture.dart',
                          'lib/quick_card.dart', 'lib/rounded_card.dart'}
              if source.testzip() is not None or not required.issubset(entries) or len(entries) != len(set(entries)):
                  sys.exit('::error::The native Flutter ZIP is incomplete or corrupt.')
              if 'version: 8.2.0+8' not in source.read('pubspec.yaml').decode('utf-8').splitlines():
                  sys.exit('::error::The source ZIP is not version 8.2.0+8.')
              for item in source.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or chr(92) in item.filename or stat.S_ISLNK(item.external_attr >> 16):
                      sys.exit('::error::Invalid ZIP entry.')
              target.mkdir(parents=True, exist_ok=True)
              source.extractall(target)
          PYTHON
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate official Flutter Android platform (no HTML/WebView)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter --version
          flutter create --platforms android --project-name mustamsakati \
            --org iq.mustamsakati --android-language kotlin --no-pub .
          # Remove Flutter template test if the generator created one.
          # Its default MyApp reference does not belong to this project.
          if [[ -f test/widget_test.dart ]] && grep -q 'MyApp' test/widget_test.dart; then
            rm test/widget_test.dart
          fi
          python3 - <<'PY'
          from pathlib import Path
          base = Path('android/app')
          manifest = base / 'src/main/AndroidManifest.xml'
          text = manifest.read_text()
          text = text.replace('android:label="mustamsakati"',
                              'android:label="مستمسكاتي"')
          if 'android.permission.CAMERA' not in text:
              text = text.replace('<application',
                '<uses-permission android:name="android.permission.CAMERA" />\n    '
                '<uses-feature android:name="android.hardware.camera" android:required="false" />\n    '
                '<application', 1)
          text = text.replace('<application', '<application android:allowBackup="false"', 1)
          manifest.write_text(text)
          for gradle in (base / 'build.gradle.kts', base / 'build.gradle'):
              if gradle.exists():
                  text = gradle.read_text()
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
                  gradle.write_text(text)
          # Use the exact pre-rendered app icon used in the Flutter header.
          import shutil
          for density in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
              folder = base / 'src/main/res' / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(f'assets/icons/ic_launcher_{density}.png',
                              folder / 'ic_launcher.png')
          PY
          test -f android/settings.gradle.kts -o -f android/settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - name: Make Gradle download resilient
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ['PROJECT_DIR']) / 'android/gradle/wrapper/gradle-wrapper.properties'
          text = p.read_text()
          pattern = r'gradle-(\d+(?:\.\d+){1,2})-(?:all|bin)\.zip'
          hit = re.search(pattern, text)
          if hit is None:
              raise RuntimeError('Expected Gradle distribution was not found')
          version = hit.group(1)
          url = f'https\\://downloads.gradle.org/distributions/gradle-{version}-bin.zip'
          text = re.sub(r'^distributionUrl=.*$', lambda _: 'distributionUrl=' + url,
                        text, count=1, flags=re.M)
          text = re.sub(r'^distributionSha256Sum=.*\n?', '', text, flags=re.M)
          for option, val in [('networkTimeout','120000'), ('retries','5'), ('retryBackOffMs','2000')]:
              text = re.sub(r'^' + option + r'=.*\n?', '', text, flags=re.M)
              text += f'\n{option}={val}\n'
          p.write_text(text)
          print('Gradle distribution:', version, '(bin, retry enabled)')
          PY

      - name: Install Flutter packages
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Catch known regressions before analysis
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/validate_source.py

      - name: Analyze Flutter source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Run native Flutter unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test

      - name: Build Android release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mustamsakati-v8.2.0-native-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
